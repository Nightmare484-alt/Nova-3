<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#05060a" />
<title>NOVA</title>
<style>
:root{
  --bg-0:#04050a;--bg-1:#070a14;--bg-2:#0b1020;
  --glass:rgba(255,255,255,.045);--glass-2:rgba(255,255,255,.07);
  --stroke:rgba(140,200,255,.14);--stroke-strong:rgba(140,200,255,.3);
  --cyan:#22d3ee;--violet:#a855f7;--magenta:#ec4899;
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --text:#e8f2ff;--text-dim:#8fa3c0;--text-faint:#5b6b85;
  --radius:18px;--radius-sm:12px;--radius-lg:26px;
  --shadow-glow:0 0 40px rgba(34,211,238,.18);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
*::selection{background:rgba(34,211,238,.35)}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg-0);color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{background:
  radial-gradient(1200px 700px at 12% -10%,rgba(34,211,238,.13),transparent 55%),
  radial-gradient(900px 700px at 110% 20%,rgba(168,85,247,.12),transparent 55%),
  radial-gradient(800px 600px at 50% 120%,rgba(236,72,153,.08),transparent 55%),
  linear-gradient(180deg,var(--bg-0),var(--bg-1) 55%,var(--bg-2))}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.6),transparent 60%),
    radial-gradient(1px 1px at 70% 12%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1.2px 1.2px at 40% 80%,rgba(180,230,255,.5),transparent 60%),
    radial-gradient(1px 1px at 85% 65%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(1px 1px at 12% 55%,rgba(255,255,255,.35),transparent 60%);
  background-size:700px 700px,900px 900px,800px 800px,1100px 1100px,600px 600px;
  opacity:.55;animation:drift 120s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:700px 700px}}
.app{position:relative;z-index:1;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding-top:var(--safe-top)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(6,10,20,.72),rgba(6,10,20,.2));border-bottom:1px solid var(--stroke)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:34px;height:34px;position:relative;display:grid;place-items:center}
.brand-mark span{position:absolute;border-radius:50%;border:1.5px solid var(--cyan);opacity:.8;animation:spin 6s linear infinite}
.brand-mark span:nth-child(1){width:34px;height:34px;border-color:var(--cyan)}
.brand-mark span:nth-child(2){width:24px;height:24px;border-color:var(--violet);animation-duration:4s;animation-direction:reverse}
.brand-mark span:nth-child(3){width:12px;height:12px;background:var(--cyan);border:none;box-shadow:0 0 14px var(--cyan)}
@keyframes spin{to{transform:rotate(360deg)}}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-text strong{font-size:17px;letter-spacing:4px;font-weight:700;
  background:linear-gradient(90deg,#a5f3fc,#c4b5fd 55%,#f0abfc);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text small{font-size:10px;color:var(--text-faint);letter-spacing:.5px}
.top-actions{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;
  border:1px solid var(--stroke);background:var(--glass);color:var(--text-dim);cursor:pointer;transition:all .18s}
.icon-btn:hover{color:var(--text);border-color:var(--stroke-strong);background:var(--glass-2)}
.icon-btn svg{width:18px;height:18px}
.layout{display:grid;grid-template-columns:1fr;min-height:0;overflow:hidden}
.stage{display:grid;grid-template-rows:auto 1fr;min-height:0;padding:12px 12px 0;gap:12px}
.core-wrap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 4px}
.core{width:min(230px,58vw);height:auto;overflow:visible}
.core-halo{opacity:.55;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.05)}}
.ring{fill:none;stroke:url(#ringGrad);stroke-width:1.2;opacity:.45;transform-origin:150px 150px}
.ring-1{stroke-dasharray:8 14;animation:spin 26s linear infinite}
.ring-2{stroke-dasharray:3 10;animation:spin 16s linear infinite reverse;opacity:.7}
.ring-3{stroke-dasharray:2 6;animation:spin 10s linear infinite;opacity:.55}
.core-orb{fill:rgba(10,18,32,.85);stroke:url(#ringGrad);stroke-width:1.4;filter:drop-shadow(0 0 14px rgba(34,211,238,.45))}
.core-inner{fill:rgba(34,211,238,.14);stroke:rgba(34,211,238,.4);stroke-width:.8;animation:breathe 4s ease-in-out infinite}
.core-label{fill:#dffbff;font-size:15px;letter-spacing:5px;font-weight:600}
.core-wrap[data-state="thinking"] .ring-1{animation-duration:6s}
.core-wrap[data-state="thinking"] .ring-2{animation-duration:4s}
.core-wrap[data-state="thinking"] .ring-3{animation-duration:2.5s}
.core-wrap[data-state="speaking"] .core-inner{animation-duration:1.4s}
.core-wrap[data-state="error"] .core-orb{stroke:var(--red);filter:drop-shadow(0 0 16px rgba(248,113,113,.55))}
.core-wrap[data-state="error"] .core-label{fill:#fecaca}
.core-meta{text-align:center;margin-top:4px}
.core-status{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:3px;color:var(--cyan);font-weight:600}
.core-status .pulse{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.core-sub{font-size:12px;color:var(--text-faint);margin-top:2px}
.chat-panel{min-height:0;border-radius:var(--radius-lg) var(--radius-lg) 0 0;border:1px solid var(--stroke);
  border-bottom:none;background:linear-gradient(180deg,rgba(8,13,24,.7),rgba(6,10,18,.85));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden;display:flex}
.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px 18px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chat-scroll::-webkit-scrollbar{width:6px}
.chat-scroll::-webkit-scrollbar-thumb{background:rgba(140,200,255,.18);border-radius:6px}
.msg{display:flex;gap:10px;margin-bottom:14px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-avatar{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-size:11px;font-weight:700;letter-spacing:1px}
.msg.user .msg-avatar{background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.4);color:#d8b4fe}
.msg.nova .msg-avatar{background:rgba(34,211,238,.13);border:1px solid rgba(34,211,238,.45);color:#a5f3fc;
  box-shadow:0 0 14px rgba(34,211,238,.25)}
.msg-body{min-width:0;flex:1}
.msg-name{font-size:10.5px;letter-spacing:2px;color:var(--text-faint);margin-bottom:4px;text-transform:uppercase}
.msg.user .msg-name{color:#b794f6}
.msg.nova .msg-name{color:#67e8f9}
.bubble{border-radius:14px;padding:11px 14px;font-size:14.5px;line-height:1.6;
  word-wrap:break-word;overflow-wrap:anywhere;border:1px solid var(--stroke);background:rgba(255,255,255,.028)}
.msg.user .bubble{background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.22)}
.msg.nova .bubble{background:rgba(34,211,238,.045);border-color:rgba(34,211,238,.2)}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:6px 0 8px 18px;padding:0}.bubble li{margin:3px 0}
.bubble a{color:var(--cyan);text-decoration:none;border-bottom:1px dotted rgba(34,211,238,.5)}
.bubble strong{color:#f0f9ff}.bubble em{color:#cbd5e1}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  background:rgba(34,211,238,.09);color:#a5f3fc;padding:1.5px 6px;border-radius:6px}
.bubble pre{background:rgba(2,6,15,.75);border:1px solid var(--stroke);border-radius:10px;
  padding:12px;margin:8px 0;overflow-x:auto}
.bubble pre code{background:none;padding:0;color:#d5e8ff;font-size:12.5px;line-height:1.55}
.bubble img{max-width:100%;border-radius:10px;display:block;margin:6px 0}
.tool-card{margin:8px 0 4px;border:1px solid rgba(251,191,36,.28);background:rgba(251,191,36,.06);
  border-radius:10px;padding:8px 11px;font-size:12.5px}
.tool-card .tc-head{display:flex;align-items:center;gap:8px;color:#fde68a;letter-spacing:.4px}
.tool-card .spinner{width:11px;height:11px;border-radius:50%;border:1.6px solid rgba(251,191,36,.35);
  border-top-color:#fbbf24;animation:spin .9s linear infinite}
.tool-card.done{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.06)}
.tool-card.done .tc-head{color:#86efac}
.tool-card.err{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.07)}
.tool-card.err .tc-head{color:#fca5a5}
.tool-card .tc-detail{color:var(--text-faint);margin-top:4px;font-size:11.5px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:tdots 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdots{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.welcome{text-align:center;padding:20px 8px 6px;color:var(--text-dim)}
.welcome h1{font-size:18px;letter-spacing:6px;font-weight:700;
  background:linear-gradient(90deg,#a5f3fc,#c4b5fd,#f0abfc);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 6px}
.welcome p{font-size:13px;margin:4px 0}
.welcome .hint{color:var(--text-faint);font-size:12px;margin-top:10px}
.command-bar{padding:10px 12px calc(12px + var(--safe-bottom));
  background:linear-gradient(180deg,rgba(6,10,18,.55),rgba(4,6,12,.95));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--stroke)}
.attachments{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.attach-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--stroke);
  background:var(--glass);border-radius:10px;padding:5px 8px 5px 10px;font-size:12px}
.attach-chip .nm{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-chip button{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.attach-chip img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.command-form{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);border-radius:26px;padding:6px 6px 6px 8px;transition:border-color .2s,box-shadow .2s}
.command-form:focus-within{border-color:rgba(34,211,238,.55);
  box-shadow:0 0 0 3px rgba(34,211,238,.11),var(--shadow-glow)}
.cmd-btn{flex:none;width:38px;height:38px;display:grid;place-items:center;border:none;background:transparent;
  color:var(--text-dim);border-radius:50%;cursor:pointer;transition:all .15s}
.cmd-btn svg{width:19px;height:19px}
.cmd-btn:hover{color:var(--text);background:rgba(255,255,255,.06)}
.cmd-mic.listening{color:#fca5a5;background:rgba(248,113,113,.14);animation:pulse 1.1s ease-in-out infinite}
.cmd-mic.speaking{color:#86efac;background:rgba(52,211,153,.12)}
.cmd-input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);
  font-size:15px;font-family:inherit;padding:10px 6px}
.cmd-input::placeholder{color:var(--text-faint)}
.cmd-send{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(34,211,238,.35);background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(168,85,247,.22));
  color:#dffbff;cursor:pointer;transition:all .18s}
.cmd-send svg{width:18px;height:18px}
.cmd-send:hover{box-shadow:0 0 18px rgba(34,211,238,.4);transform:translateY(-1px)}
.cmd-send:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;
  background:rgba(2,4,10,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{width:min(560px,100%);max-height:90dvh;display:flex;flex-direction:column;
  border:1px solid var(--stroke-strong);border-radius:var(--radius-lg);
  background:linear-gradient(180deg,rgba(11,16,32,.97),rgba(6,10,20,.98));
  box-shadow:0 30px 90px rgba(0,0,0,.65),var(--shadow-glow);overflow:hidden;
  animation:pop .25s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--stroke)}
.modal-head h2{margin:0;font-size:12px;letter-spacing:3px;color:var(--cyan);font-weight:700}
.camera-stage{position:relative;background:#000;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.camera-stage video{width:100%;height:100%;object-fit:contain;background:#000}
.modal-actions{display:flex;gap:8px;padding:14px 16px;justify-content:flex-end;border-top:1px solid var(--stroke)}
.btn{padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;
  border:1px solid transparent;transition:all .16s}
.btn.primary{background:linear-gradient(135deg,rgba(34,211,238,.35),rgba(168,85,247,.35));
  border-color:rgba(34,211,238,.5);color:#e0fbff}
.btn.ghost{background:rgba(255,255,255,.04);border-color:var(--stroke);color:var(--text-dim)}
.btn.danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.4);color:#fecaca}
.settings-body{padding:8px 6px 16px;overflow-y:auto}
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:12px;cursor:pointer}
.setting:hover{background:rgba(255,255,255,.03)}
.setting div{display:flex;flex-direction:column;gap:2px;min-width:0}
.setting strong{font-size:13.5px;font-weight:600;color:var(--text)}
.setting small{font-size:11.5px;color:var(--text-faint)}
.setting input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;
  flex:none;background:rgba(255,255,255,.09);border:1px solid var(--stroke);position:relative;cursor:pointer;transition:all .2s}
.setting input[type="checkbox"]::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:#94a3b8;transition:all .2s}
.setting input[type="checkbox"]:checked{background:linear-gradient(90deg,rgba(34,211,238,.5),rgba(168,85,247,.5));
  border-color:rgba(34,211,238,.6)}
.setting input[type="checkbox"]:checked::after{left:20px;background:#e0fbff}
.toasts{position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translateX(-50%);
  z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  width:min(400px,calc(100vw - 24px))}
.toast{background:rgba(10,16,30,.95);border:1px solid var(--stroke-strong);border-radius:12px;
  padding:10px 16px;font-size:13px;color:var(--text);box-shadow:0 12px 34px rgba(0,0,0,.5);
  animation:toastIn .28s ease both;max-width:100%}
.toast.err{border-color:rgba(248,113,113,.5);color:#fecaca}
.toast.ok{border-color:rgba(52,211,153,.5);color:#bbf7d0}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (min-width:900px){
  .app{padding-top:0}
  .topbar{padding:14px 24px}
  .layout{grid-template-columns:1fr 1fr;padding:16px 24px 0;gap:18px;max-width:1500px;margin:0 auto;width:100%}
  .stage{padding:0;grid-template-columns:1fr;grid-template-rows:1fr auto;gap:18px}
  .core-wrap{justify-content:center}
  .core{width:min(340px,30vw)}
  .chat-panel{border-radius:var(--radius-lg);border-bottom:1px solid var(--stroke)}
  .command-bar{max-width:1500px;margin:0 auto;width:100%;padding:12px 24px 18px;background:transparent;
    backdrop-filter:none;-webkit-backdrop-filter:none;border-top:none}
  .command-form{max-width:900px;margin:0 auto;background:rgba(255,255,255,.05);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="brand-mark"><span></span><span></span><span></span></div>
    <div class="brand-text"><strong>NOVA</strong><small>Neural Operations Virtual Assistant</small></div>
  </div>
  <div class="top-actions">
    <button id="btn-new-chat" class="icon-btn" title="New chat" aria-label="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9.5A1.7 1.7 0 0 0 10.5 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9.5a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="core-wrap" id="core-wrap" data-state="idle">
      <svg class="core" viewBox="0 0 300 300">
        <defs>
          <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#67e8f9" stop-opacity=".9"/>
            <stop offset="45%" stop-color="#22d3ee" stop-opacity=".35"/>
            <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#22d3ee"/>
            <stop offset="50%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <circle class="core-halo" cx="150" cy="150" r="110" fill="url(#coreGlow)"/>
        <circle class="ring ring-1" cx="150" cy="150" r="118"/>
        <circle class="ring ring-2" cx="150" cy="150" r="96"/>
        <circle class="ring ring-3" cx="150" cy="150" r="74"/>
        <circle class="core-orb" cx="150" cy="150" r="52"/>
        <circle class="core-inner" cx="150" cy="150" r="34"/>
        <text class="core-label" x="150" y="156" text-anchor="middle">NOVA</text>
      </svg>
      <div class="core-meta">
        <div class="core-status"><span class="pulse"></span><span id="core-state-label">ONLINE</span></div>
        <div class="core-sub" id="core-sub-label">Ready when you are.</div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-scroll" id="chat-scroll"></div>
    </div>
  </section>
</main>

<footer class="command-bar">
  <div class="attachments" id="attachments" hidden></div>
  <form class="command-form" id="command-form" autocomplete="off">
    <button type="button" id="btn-attach" class="cmd-btn" title="Attach file" aria-label="Attach">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21.4 11.05L12.3 20.2a5.5 5.5 0 1 1-7.8-7.8l9.1-9.1a3.7 3.7 0 1 1 5.2 5.2l-9.1 9.1a1.85 1.85 0 1 1-2.6-2.6l8.1-8.1"/></svg>
    </button>
    <input type="file" id="file-input" hidden multiple />

    <button type="button" id="btn-camera" class="cmd-btn" title="Camera" aria-label="Camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2l1-1.6A2 2 0 0 1 9.4 3.5h5.2a2 2 0 0 1 1.7.9l1 1.6h1.2A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><circle cx="12" cy="12.5" r="3.4"/></svg>
    </button>

    <button type="button" id="btn-mic" class="cmd-btn cmd-mic" title="Speak" aria-label="Voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
    </button>

    <input type="text" id="prompt" class="cmd-input" placeholder="Ask NOVA…" aria-label="Message NOVA" enterkeyhint="send" />

    <button type="submit" id="btn-send" class="cmd-send" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
    </button>
  </form>
</footer>
</div>

<div class="modal" id="camera-modal" hidden>
  <div class="modal-card">
    <header class="modal-head"><h2>CAMERA</h2>
      <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="camera-stage"><video id="camera-video" playsinline autoplay muted></video></div>
    <div class="modal-actions">
      <button class="btn ghost" id="btn-cam-switch">Switch</button>
      <button class="btn primary" id="btn-cam-capture">Capture &amp; analyze</button>
    </div>
  </div>
</div>

<div class="modal" id="settings-modal" hidden>
  <div class="modal-card">
    <header class="modal-head"><h2>SETTINGS</h2>
      <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="settings-body">
      <label class="setting"><div><strong>Voice output</strong><small>Speak replies aloud.</small></div><input type="checkbox" id="set-voice" checked /></label>
      <label class="setting"><div><strong>Auto-speak</strong><small>Automatically after each reply.</small></div><input type="checkbox" id="set-autospeak" checked /></label>
      <label class="setting"><div><strong>Memory</strong><small>Keep chat history in this browser.</small></div><input type="checkbox" id="set-memory" checked /></label>
      <div class="setting" style="cursor:default"><div><strong>AI model</strong><small id="set-model-name">—</small></div></div>
      <button class="btn danger" style="width:100%;margin-top:8px" id="btn-clear-all">Clear all data</button>
    </div>
  </div>
</div>

<div class="modal" id="confirm-modal" hidden>
  <div class="modal-card">
    <header class="modal-head"><h2>CONFIRM ACTION</h2></header>
    <div class="confirm-body">
      <p id="confirm-text">Proceed?</p>
      <pre id="confirm-details" class="confirm-details" hidden></pre>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="btn-confirm-cancel">Cancel</button>
      <button class="btn primary" id="btn-confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
